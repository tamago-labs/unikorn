<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unikorn — Project</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{ background:#FBFAFE; color:#251F33; font-family:'Manrope',sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .grad{ background:linear-gradient(135deg,#7C5CFC,#B79CFF); }
  .card{ background:#fff; border:1px solid #EFEAFB; }
  .tab{ transition:all .15s; }
  .tab.active{ background:#251F33; color:#fff; }
  .tab:not(.active){ color:#6E6480; }
  .tab:not(.active):hover{ background:#F1ECFE; }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:#E5DEFA; border-radius:3px; }
</style>
</head>
<body class="min-h-screen">

  <header class="border-b border-[#EFEAFB] bg-white">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full grad"></div>
        <span class="font-extrabold text-[15px]">Unikorn</span>
        <span class="text-[#D6CCF2]">/</span>
        <span class="text-sm text-[#6E6480] mono">acme-api</span>
      </div>
      <button class="text-xs font-medium border border-[#E5DEFA] rounded-full px-3.5 py-1.5 hover:bg-[#F1ECFE] transition-colors">Re-scan repo</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">

    <!-- FIXED VERIFIED CORE -->
    <div class="card rounded-2xl p-5 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-11 h-11 rounded-xl bg-[#EAFBF1] flex items-center justify-center shrink-0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.3"><path d="M5 12l5 5L20 7"/></svg>
        </div>
        <div>
          <p class="text-sm font-semibold">PRD verified — 35 of 41 claims proved</p>
          <p class="text-xs text-[#8A7FA6] mt-0.5 mono">source: acme-api@main · kane-cli run #48</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full border-4 border-[#22C55E] flex items-center justify-center text-[11px] font-bold">85%</div>
        <button class="text-xs font-medium border border-[#E5DEFA] rounded-full px-3.5 py-1.5 hover:bg-[#F1ECFE] transition-colors">View PRD</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="flex items-center gap-1.5 mt-8 bg-[#F1ECFE] rounded-full p-1 w-fit">
      <button class="tab active rounded-full px-4 py-2 text-sm font-medium">Tutorial <span class="opacity-60 mono text-xs">·4</span></button>
      <button class="tab rounded-full px-4 py-2 text-sm font-medium">Slide deck <span class="opacity-60 mono text-xs">·2</span></button>
      <button class="tab rounded-full px-4 py-2 text-sm font-medium">Marketing <span class="opacity-60 mono text-xs">·6</span></button>
    </div>

    <!-- GALLERY GRID -->
    <div class="grid sm:grid-cols-3 gap-4 mt-6">
      <button class="card rounded-2xl border-dashed flex flex-col items-center justify-center gap-2 aspect-[4/3] hover:border-[#7C5CFC] transition-colors">
        <div class="w-9 h-9 rounded-full bg-[#F1ECFE] flex items-center justify-center text-[#7C5CFC]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <span class="text-xs text-[#8A7FA6] font-medium">New tutorial</span>
      </button>

      <div class="card rounded-2xl overflow-hidden">
        <div class="aspect-[4/3] bg-gradient-to-br from-[#F1ECFE] to-[#E5DEFA] flex items-center justify-center">
          <span class="text-xs mono text-[#8A7FA6]">4 slides</span>
        </div>
        <div class="p-3.5">
          <p class="text-sm font-semibold">Developer onboarding</p>
          <p class="text-xs text-[#8A7FA6] mt-0.5">v3 · edited 2h ago</p>
        </div>
      </div>

      <div class="card rounded-2xl overflow-hidden">
        <div class="aspect-[4/3] bg-gradient-to-br from-[#F1ECFE] to-[#E5DEFA] flex items-center justify-center">
          <span class="text-xs mono text-[#8A7FA6]">6 slides</span>
        </div>
        <div class="p-3.5">
          <p class="text-sm font-semibold">Quickstart — CLI users</p>
          <p class="text-xs text-[#8A7FA6] mt-0.5">v1 · edited yesterday</p>
        </div>
      </div>

      <div class="card rounded-2xl overflow-hidden opacity-70">
        <div class="aspect-[4/3] bg-gradient-to-br from-[#F1ECFE] to-[#E5DEFA] flex items-center justify-center">
          <span class="text-xs mono text-[#8A7FA6]">3 slides</span>
        </div>
        <div class="p-3.5">
          <p class="text-sm font-semibold">Non-technical walkthrough</p>
          <p class="text-xs text-[#8A7FA6] mt-0.5">v1 · draft</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
